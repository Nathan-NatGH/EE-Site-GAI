<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Exclusive</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;"><h3>Runtime Error</h3><p>' + message + '</p><pre>' + (error && error.stack ? error.stack : '') + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;"><h3>Unhandled Promise Rejection</h3><p>' + event.reason + '</p></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
